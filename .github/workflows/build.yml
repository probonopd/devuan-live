name: Build Devuan Live ISO

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    container:
      image: debian:latest
      volumes:
        - /proc:/proc
      options: --privileged
    name: Devuan Live ISO Build
    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y git sudo live-build curl debootstrap wget

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Devuan debootstrap script
        run: |
          # Create symlink for chimaera to use sid script
          ln -sf sid /usr/share/debootstrap/scripts/chimaera

      - name: Install Devuan keyring
        run: |
          # Create required directories
          mkdir -p /usr/share/keyrings /root/.gnupg
          chmod 700 /root/.gnupg
          # Try downloading the keyring package
          cd /tmp
          # Try multiple sources for the keyring
          wget -q http://pkgmaster.devuan.org/devuan/pool/main/d/devuan-keyring/devuan-keyring_2023.10.07_all.deb && dpkg -i devuan-keyring_2023.10.07_all.deb || \
          wget -q https://git.devuan.org/devuan/devuan-keyring/-/archive/2023.10.07/devuan-keyring-2023.10.07.tar.gz && \
            tar -xzf devuan-keyring-2023.10.07.tar.gz && \
            cp devuan-keyring-2023.10.07/keyrings/* /usr/share/keyrings/ || \
          echo "Warning: Could not install Devuan keyring, using embedded keys"
          # Ensure the keyring file exists even if empty (debootstrap will use it if LB_BOOTSTRAP_KEYRING is set)
          touch /usr/share/keyrings/devuan-archive-keyring.gpg

      - name: Configure live-build
        run: |
          lb config

      - name: Build the ISO
        run: |
          lb build
          iso_file=$(ls *.iso | head -n 1)
          date_str=$(date +%Y.%m.%d)
          mv "$iso_file" "devuan-live-${date_str}-amd64.iso"

      - name: Upload files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -lh *.iso
          wget -c https://github.com/probonopd/uploadtool/raw/master/upload.sh
          bash upload.sh *.iso
