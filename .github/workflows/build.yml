name: Build Devuan Live ISO

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    container:
      image: debian:latest
      volumes:
        - /proc:/proc
      options: --privileged
    name: Devuan Live ISO Build
    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y git sudo live-build curl debootstrap wget

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Devuan debootstrap script
        run: |
          # Create symlink for chimaera to use sid script
          ln -sf sid /usr/share/debootstrap/scripts/chimaera

      - name: Install Devuan keyring
        run: |
          # Get Devuan keyring directly from the release file
          mkdir -p /usr/share/keyrings
          # Download the Devuan signing key directly
          wget -O- https://pkgmaster.devuan.org/devuan/pool/main/d/devuan-keyring/devuan-keyring_2023.10.07_all.deb | \
            dpkg -i - || \
          wget -O- https://deb.devuan.org/devuan/pool/main/d/devuan-keyring/devuan-keyring_2023.10.07_all.deb | \
            dpkg -i - || \
          ( apt-get update && apt-get install -y gnupg && \
            gpg --no-default-keyring --keyring /usr/share/keyrings/devuan-archive-keyring.gpg \
            --keyserver keyserver.ubuntu.com --recv-keys 94532124541922FB )

      - name: Configure live-build
        run: |
          lb config

      - name: Build the ISO
        run: |
          lb build
          iso_file=$(ls *.iso | head -n 1)
          date_str=$(date +%Y.%m.%d)
          mv "$iso_file" "devuan-live-${date_str}-amd64.iso"

      - name: Upload files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -lh *.iso
          wget -c https://github.com/probonopd/uploadtool/raw/master/upload.sh
          bash upload.sh *.iso
